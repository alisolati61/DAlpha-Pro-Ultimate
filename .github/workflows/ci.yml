name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Secret scan
        run: >-
          python scripts/scan_repository_secrets.py
          --base-ref vst-runtime-freeze-v1

      - name: Test
        run: python -m pytest

      - name: Ruff post-freeze baseline
        shell: bash
        run: |
          mapfile -d '' files < <(
            git diff --name-only --diff-filter=ACMR -z \
              exchange-freeze-v1..HEAD -- '*.py'
          )
          if ((${#files[@]})); then
            python -m ruff check "${files[@]}"
          fi

      - name: Mypy project-compatible scope
        run: >-
          python -m mypy --follow-imports=skip --ignore-missing-imports
          main.py src/cli.py src/core src/data
          src/decision/__init__.py src/decision/recorded.py
          src/decision/replay.py src/strategy src/risk src/execution
          src/exchange/bingx_client.py src/execution_intent
          src/paper_runtime src/vst_runtime
          scripts/bingx_vst_demo_order.py
          scripts/bingx_vst_readiness.py
          scripts/bingx_vst_transport_diagnostic.py
          scripts/scan_repository_secrets.py

      - name: Compile
        run: python -m compileall -q main.py scripts src

      - name: Build
        run: python -m build

      - name: Whitespace
        run: git diff --check exchange-freeze-v1..HEAD
