[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-pro-x-infinity"
version = "0.1.0"
description = "Enterprise Multi-Asset Trading Platform"
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.4,<5",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "loguru>=0.7,<1",
    "httpx>=0.27,<1",
    "orjson>=3.10,<4",
    "tenacity>=8.2,<10",
    "pydantic-settings>=2.2,<3",
    "websockets>=12,<16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2",
    "coverage>=7,<8",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "black>=24,<27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = false
